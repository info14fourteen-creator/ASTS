name: Shared validation

on:
  pull_request:
    paths:
      - "packages/shared/**"
      - "docs/19-continuation-70-step-plan-ru.md"
      - ".github/workflows/shared-validation.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "packages/shared/**"
      - "docs/19-continuation-70-step-plan-ru.md"
      - ".github/workflows/shared-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate shared schemas and fixtures
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/shared
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate
        run: npm run validate

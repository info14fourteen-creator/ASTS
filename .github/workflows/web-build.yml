name: Web build

on:
  pull_request:
    paths:
      - "apps/api/README.md"
      - "apps/web/**"
      - "packages/shared/ai-review-queue.json"
      - "packages/shared/fns-connector-gate.json"
      - "packages/shared/README.md"
      - "packages/shared/source-owner-receipts.json"
      - ".github/workflows/web-build.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "apps/api/README.md"
      - "apps/web/**"
      - "packages/shared/ai-review-queue.json"
      - "packages/shared/fns-connector-gate.json"
      - "packages/shared/README.md"
      - "packages/shared/source-owner-receipts.json"
      - ".github/workflows/web-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app.site.ru shell
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke owner receipt parity
        run: npm run smoke:owner-receipts

      - name: Smoke FNS approvals parity
        run: npm run smoke:fns-approvals

      - name: Smoke AI review action parity
        run: npm run smoke:ai-review-actions

      - name: Smoke shared README command parity
        run: npm run smoke:shared-readme-commands

      - name: Smoke schema docs README existence
        run: npm run smoke:schema-docs-readme

      - name: Smoke schema docs README workflow
        run: npm run smoke:schema-docs-workflow

      - name: Smoke schema docs live route gate
        run: npm run smoke:schema-docs-live-route

      - name: Smoke schema docs README failure copy
        run: npm run smoke:schema-docs-readme-failure-copy

      - name: Smoke shared validation workflow file
        run: npm run smoke:shared-validation-workflow

      - name: Smoke shared validation workflow step
        run: npm run smoke:shared-validation-workflow-step

      - name: Smoke shared validation live route gate
        run: npm run smoke:shared-validation-live-route

      - name: Smoke web build workflow file
        run: npm run smoke:web-build-workflow

      - name: Smoke web build workflow self-check
        run: npm run smoke:web-build-self-check

      - name: Smoke web build live route gate
        run: npm run smoke:web-build-live-route

      - name: Smoke API README trigger path
        run: npm run smoke:api-readme-trigger

      - name: Smoke API README live route gate
        run: npm run smoke:api-readme-live-route

      - name: Smoke AI review API README failure copy
        run: npm run smoke:ai-review-api-readme-failure-copy

      - name: Smoke rendered routes
        run: |
          npm run start -- -H 127.0.0.1 -p 4177 > /tmp/asts-web.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4177/ >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/asts-web.log
              exit 1
            fi
            sleep 1
          done

          npm run smoke -- --url http://127.0.0.1:4177/
          npm run smoke:source-receipt-docs-link -- --url http://127.0.0.1:4177
          npm run smoke:ai-review-api-readme -- --url http://127.0.0.1:4177

name: Web build

on:
  pull_request:
    paths:
      - "apps/api/README.md"
      - "apps/web/**"
      - "packages/shared/ai-review-queue.json"
      - "packages/shared/fns-connector-gate.json"
      - "packages/shared/README.md"
      - "packages/shared/source-owner-receipts.json"
      - ".github/workflows/web-build.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "apps/api/README.md"
      - "apps/web/**"
      - "packages/shared/ai-review-queue.json"
      - "packages/shared/fns-connector-gate.json"
      - "packages/shared/README.md"
      - "packages/shared/source-owner-receipts.json"
      - ".github/workflows/web-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app.site.ru shell
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke owner receipt parity
        run: npm run smoke:owner-receipts

      - name: Smoke source owner receipts rendered routes failure copy
        run: npm run smoke:source-owner-receipts-rendered-route-failure-copy

      - name: Smoke owner receipt API rendered routes failure copy
        run: npm run smoke:owner-receipt-api-rendered-route-failure-copy

      - name: Smoke source owner receipt write API draft

name: Web build

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-build.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "apps/web/**"
      - ".github/workflows/web-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app.site.ru shell
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
